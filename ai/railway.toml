# Public AI service config for a separate Railway service that points to `/ai/railway.toml`.

[build]
builder = "DOCKERFILE"
dockerfilePath = "/ai/Dockerfile"
watchPatterns = [
  "/ai/**",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

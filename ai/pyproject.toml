[project]
name = "ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.3",
    "geoalchemy2>=0.18.4",
    "numpy>=2.4.4",
    "pgvector>=0.4.2",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.1.0",
    "sqlalchemy>=2.0.49",
    "torch>=2.11.0",
    "transformers>=5.5.3",
    "uvicorn>=0.44.0",
    "websockets>=15.0.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

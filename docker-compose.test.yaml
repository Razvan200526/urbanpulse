name: urbanpulse-test

services:
  postgres_test:
    image: postgis/postgis:17-3.4
    environment:
      POSTGRES_USER: urbanpulse
      POSTGRES_PASSWORD: urbanpulse
      POSTGRES_DB: urbanpulse_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanpulse -d urbanpulse_test"]
      interval: 5s
      timeout: 5s
      retries: 20

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

  server-repositories:
    name: Server Repository Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_USER: urbanpulse
          POSTGRES_PASSWORD: urbanpulse
          POSTGRES_DB: urbanpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbanpulse -d urbanpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run repository integration tests
        working-directory: server
        env:
          TEST_DB_MANAGED_EXTERNALLY: "1"
          DATABASE_URL: postgresql://urbanpulse:urbanpulse@localhost:5432/urbanpulse_test
        run: bun test

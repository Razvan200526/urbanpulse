name: CI

on:
  pull_request:
  push:

env:
  BUN_VERSION: 1.3.11

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Client lint
        run: bun run --cwd client lint

      - name: Client type-check
        run: bun run --cwd client type-check

      - name: Client tests
        run: bun run --cwd client test

      - name: Client build
        run: bun run --cwd client build

  server:
    name: Server Verification
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://urbanpulse:urbanpulse@localhost:5433/urbanpulse_test
      TEST_DB_MANAGED_EXTERNALLY: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Start test database
        run: bun run --cwd server test:db:up

      - name: Server build
        run: bun run --cwd server build

      - name: Bootstrap and migrate database
        run: bun run --cwd server db:migrate

      - name: Verify database contract
        run: bun run --cwd server db:verify --smoke

      - name: Run repository integration tests
        run: bun run --cwd server test

      - name: Run service integration tests
        run: bun run --cwd server test:services

      - name: Stop test database
        if: always()
        run: bun run --cwd server test:db:down

  ai:
    name: AI Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: AI build
        run: bun run --cwd ai build

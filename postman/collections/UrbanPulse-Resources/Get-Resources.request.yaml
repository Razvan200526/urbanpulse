$kind: http-request
name: Get Resources
method: GET
url: '{{baseUrl}}/api/resources'
order: 1000
description: Returns a list of resources, optionally filtered. Requires an active session cookie (Better Auth).
queryParams:
  - key: filter
    value: '{{resourceFilter}}'
tests:
  script: |-
    // Note: this endpoint returns 201, not 200
    pm.test("Status code is 201", function () {
      pm.response.to.have.status(201);
    });
    pm.test("Response has success true and message 'Resources retrieved successfully'", function () {
      const json = pm.response.json();
      pm.expect(json).to.have.property("success");
      pm.expect(json.success).to.equal(true);
      pm.expect(json).to.have.property("message");
      pm.expect(json.message).to.equal("Resources retrieved successfully");
      pm.expect(json).to.have.property("data");
      pm.expect(json.data).to.be.an("array");
    });
    // Unauthenticated: expect 401 when no session cookie is present
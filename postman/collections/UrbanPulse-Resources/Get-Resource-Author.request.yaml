$kind: http-request
name: Get Resource Author
method: GET
url: '{{baseUrl}}/api/resources/{{resourceId}}/author'
order: 3000
description: Returns the author of a resource by resource ID. Requires an active session cookie (Better Auth).
pathVariables:
  - key: resourceId
    value: '{{resourceId}}'
tests:
  script: |-
    pm.test("Status code is 200", function () {
      pm.response.to.have.status(200);
    });
    pm.test("Response has success true and message 'Author retrieved successfully'", function () {
      const json = pm.response.json();
      pm.expect(json).to.have.property("success");
      pm.expect(json.success).to.equal(true);
      pm.expect(json).to.have.property("message");
      pm.expect(json.message).to.equal("Author retrieved successfully");
      pm.expect(json).to.have.property("data");
    });
    // Unauthenticated: expect 401 when no session cookie is present
$kind: http-request
name: Upload Audio
method: POST
url: '{{baseUrl}}/api/upload/audio'
order: 2000
description: Uploads an audio file as multipart form-data. Requires an active session cookie (Better Auth).
body:
  type: formdata
  content:
    - key: file
      type: file
      src: ''
    - key: type
      type: text
      value: audio
tests:
  script: |-
    pm.test("Status code is 200", function () {
      pm.response.to.have.status(200);
    });
    pm.test("Response has success true and message 'Audio file uploaded successfully'", function () {
      const json = pm.response.json();
      pm.expect(json).to.have.property("success");
      pm.expect(json.success).to.equal(true);
      pm.expect(json).to.have.property("message");
      pm.expect(json.message).to.equal("Audio file uploaded successfully");
      pm.expect(json).to.have.property("data");
      pm.expect(json.data).to.have.property("url");
      pm.expect(json.data.url).to.be.a("string");
    });
    // Unauthenticated: expect 401 when no session cookie is present
$kind: http-request
name: Get Admin Reports
method: GET
url: '{{baseUrl}}/api/admin/reports'
order: 2000
description: Returns all submitted reports for admin review. Requires an active admin session cookie (Better Auth).
tests:
  script: |-
    pm.test("Status code is 200", function () {
      pm.response.to.have.status(200);
    });
    pm.test("Response has success true and message 'Admin reports retrieved'", function () {
      const json = pm.response.json();
      pm.expect(json).to.have.property("success");
      pm.expect(json.success).to.equal(true);
      pm.expect(json).to.have.property("message");
      pm.expect(json.message).to.equal("Admin reports retrieved");
      pm.expect(json).to.have.property("data");
      pm.expect(json.data).to.have.property("reports");
      pm.expect(json.data.reports).to.be.an("array");
    });
    // Unauthenticated or non-admin: expect 401/403
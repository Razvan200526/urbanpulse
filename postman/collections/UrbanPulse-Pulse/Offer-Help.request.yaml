$kind: http-request
name: Offer Help
method: POST
url: '{{baseUrl}}/api/pulse/{{pulseId}}/responses'
order: 3000
description: Submits a help offer response for a pulse. Requires an active session cookie (Better Auth).
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: pulseId
    value: '{{pulseId}}'
body:
  type: json
  content: |-
    {
      "note": "I can help!"
    }
tests:
  script: |-
    pm.test("Status code is 200", function () {
      pm.response.to.have.status(200);
    });
    pm.test("Response has success true and message 'Help offer recorded'", function () {
      const json = pm.response.json();
      pm.expect(json).to.have.property("success");
      pm.expect(json.success).to.equal(true);
      pm.expect(json).to.have.property("message");
      pm.expect(json.message).to.equal("Help offer recorded");
      pm.expect(json).to.have.property("data");
      pm.expect(json.data).to.have.property("id");
    });
    pm.test("Saves responseId to environment", function () {
      const json = pm.response.json();
      if (json.data && json.data.id) {
        pm.environment.set("responseId", json.data.id);
      }
    });
    // Unauthenticated: expect 401 when no session cookie is present
$kind: http-request
name: Get Profile
method: GET
url: '{{baseUrl}}/api/users/profile'
order: 3000
description: Returns the authenticated user's profile. Requires an active session cookie (Better Auth).
tests:
  script: |-
    pm.test("Status code is 200", function () {
      pm.response.to.have.status(200);
    });
    pm.test("Response has success, message, and data fields", function () {
      const json = pm.response.json();
      pm.expect(json).to.have.property("success");
      pm.expect(json).to.have.property("message");
      pm.expect(json).to.have.property("data");
      pm.expect(json.success).to.equal(true);
    });
    // Unauthenticated: expect 401 when no session cookie is present
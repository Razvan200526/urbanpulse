$kind: http-request
name: Update Profile
method: PATCH
url: '{{baseUrl}}/api/users/profile'
order: 4000
description: Updates the authenticated user's profile. Requires an active session cookie (Better Auth).
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{userName}}",
      "bio": "{{userBio}}",
      "location": {
        "lat": 0,
        "lon": 0
      }
    }
tests:
  script: |-
    pm.test("Status code is 200", function () {
      pm.response.to.have.status(200);
    });
    pm.test("Response has success true and message 'Profile updated'", function () {
      const json = pm.response.json();
      pm.expect(json).to.have.property("success");
      pm.expect(json.success).to.equal(true);
      pm.expect(json).to.have.property("message");
      pm.expect(json.message).to.equal("Profile updated");
      pm.expect(json).to.have.property("data");
    });
$kind: http-request
name: Update Quiet Hours
method: PUT
url: '{{baseUrl}}/api/users/quiet-hours'
order: 5000
description: Updates the authenticated user's quiet hours settings. Requires an active session cookie (Better Auth).
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "enabled": true,
      "startTime": "22:00",
      "endTime": "07:00"
    }
tests:
  script: |-
    pm.test("Status code is 200", function () {
      pm.response.to.have.status(200);
    });
    pm.test("Response has success true and message 'Quiet hours saved'", function () {
      const json = pm.response.json();
      pm.expect(json).to.have.property("success");
      pm.expect(json.success).to.equal(true);
      pm.expect(json).to.have.property("message");
      pm.expect(json.message).to.equal("Quiet hours saved");
      pm.expect(json).to.have.property("data");
    });
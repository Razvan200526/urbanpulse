$kind: http-request
name: Delete Account
method: DELETE
url: '{{baseUrl}}/api/users/account'
order: 7000
description: Permanently deletes the authenticated user's account. Requires an active session cookie (Better Auth).
tests:
  script: |-
    pm.test("Status code is 200", function () {
      pm.response.to.have.status(200);
    });
    pm.test("Response has success true and message 'Account deleted'", function () {
      const json = pm.response.json();
      pm.expect(json).to.have.property("success");
      pm.expect(json.success).to.equal(true);
      pm.expect(json).to.have.property("message");
      pm.expect(json.message).to.equal("Account deleted");
      pm.expect(json).to.have.property("data");
      pm.expect(json.data).to.equal(null);
    });
# Backend service config for the existing `urbanpulse` Railway service.

[build]
builder = "RAILPACK"
buildCommand = "bun run build:server"
watchPatterns = [
  "/server/**",
  "/shared/**",
  "/package.json",
  "/bun.lock",
  "/tsconfig.json",
  "/turbo.json",
]

[deploy]
startCommand = "cd server && bun run start:prod"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

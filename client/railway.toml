# Frontend service config for a separate Railway service that points to `/client/railway.toml`.

[build]
builder = "RAILPACK"
buildCommand = "bun run build:client"
watchPatterns = [
  "/client/**",
  "/shared/**",
  "/server/src/client.ts",
  "/server/package.json",
  "/package.json",
  "/bun.lock",
  "/tsconfig.json",
  "/turbo.json",
]

[deploy]
startCommand = "cd client && bun run start:prod --host"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

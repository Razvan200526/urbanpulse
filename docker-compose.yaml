services:
  maildev:
    image: maildev/maildev
    ports:
      - "1025:1025"
      - "80:1080"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: urbanpulse
      POSTGRES_PASSWORD: urbanpulse
      POSTGRES_DB: urbanpulse
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
